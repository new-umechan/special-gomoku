<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>超能力五目並べ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button type="button" id="logo-btn" class="logo" title="タイトルに戻る">超能力五目並べ</button>
    <span class="topbar-actions">
      <button type="button" id="sound-btn" class="btn-icon" aria-label="効果音" title="効果音のオン・オフ">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="sound-on" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="sound-off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
      <button type="button" id="share-btn" class="btn-text" hidden>画像共有</button>
      <button type="button" id="log-btn" class="btn-text">ログ</button>
      <button type="button" id="decks-btn" class="btn-text">デッキ</button>
      <button type="button" id="rules-btn" class="btn-text">ルール</button>
    </span>
  </header>

  <main>
    <!-- タイトル -->
    <section id="title-screen" class="screen title-screen">
      <div id="title-art" class="title-art"></div>
      <div class="title-content">
        <h1 class="title">超能力<br>五目並べ</h1>
        <p class="title-call">超能力を駆使して五目並べろ！</p>
        <div class="title-buttons">
          <button type="button" id="start-pvp" class="btn-primary mode-btn" aria-label="2人で対戦">
            <svg class="mode-icon" viewBox="0 0 48 48" aria-hidden="true" fill="#fff"><circle cx="16" cy="15" r="6.5"/><path d="M4 39c0-7.5 5.4-13 12-13s12 5.5 12 13z"/><circle cx="32" cy="15" r="6.5" stroke="#e5533d" stroke-width="3"/><path d="M20 39c0-7.5 5.4-13 12-13s12 5.5 12 13z" stroke="#e5533d" stroke-width="3" stroke-linejoin="round"/></svg>
            <span class="mode-label">ふたりで</span>
          </button>
          <button type="button" id="start-cpu" class="btn-primary btn-cpu mode-btn" aria-label="CPUと対戦">
            <svg class="mode-icon" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="13" y="13" width="22" height="22" rx="4"/><rect x="19" y="19" width="10" height="10" rx="1.5" fill="currentColor"/><path d="M19 13V7M29 13V7M19 41v-6M29 41v-6M13 19H7M13 29H7M41 19h-6M41 29h-6"/></svg>
            <span class="mode-label">CPU</span>
          </button>
          <button type="button" id="start-online" class="btn-primary btn-online mode-btn" aria-label="オンライン対戦">
            <svg class="mode-icon" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><circle cx="24" cy="24" r="16"/><path d="M8 24h32M24 8c-5 4.5-7 10-7 16s2 11.5 7 16M24 8c5 4.5 7 10 7 16s-2 11.5-7 16"/></svg>
            <span class="mode-label">オンライン</span>
          </button>
        </div>
      </div>
    </section>

    <!-- オンライン対戦：相手をさがす -->
    <section id="online-screen" class="screen online-screen" hidden>
      <div class="online-search" aria-hidden="true"><i></i><i></i><i></i></div>
      <p id="online-title" class="online-title">対戦相手をさがしています</p>
      <p id="online-sub" class="online-sub"></p>
      <button type="button" id="online-cancel" class="btn-text">やめる</button>
    </section>

    <!-- デッキをえらぶ -->
    <section id="select-screen" class="screen select-screen" hidden>
      <h2 id="select-title" class="phase-title select-title">デッキをえらぼう！</h2>
      <div id="select-cols" class="select-cols"></div>
      <div class="select-foot">
        <label id="name-field" class="name-field" hidden>
          <span>あなたの名前</span>
          <input id="my-name" maxlength="12" placeholder="名前はまだない" autocomplete="nickname">
        </label>
        <button type="button" id="select-go" class="btn-primary select-go">この2つで対戦</button>
      </div>
    </section>

    <!-- デッキを作る -->
    <section id="deck-screen" class="screen deck-screen" hidden>
      <div class="deck-head">
        <div class="build-call">
          <button type="button" id="deck-back" class="build-back" aria-label="もどる"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
          <input id="deck-name" class="deck-name" maxlength="16" aria-label="デッキの名前" autocomplete="off">
        </div>
        <div class="deck-templates">
          <span class="templates-label">ひな形</span>
          <div id="deck-starters" class="deck-starters" aria-label="ひな形"></div>
        </div>
      </div>
      <div class="deck-main">
        <div id="deck-catalog" class="deck-catalog"></div>
        <aside class="deck-side">
          <div id="deck-meter" class="deck-meter"></div>
          <div id="deck-bag" class="deck-bag" aria-label="デッキの中身"></div>
          <div id="deck-info" class="deck-info"></div>
          <div class="deck-actions">
            <button type="button" id="deck-delete" class="btn-text deck-delete">消す</button>
            <button type="button" id="deck-go" class="btn-primary deck-go">保存</button>
          </div>
        </aside>
      </div>
      <p id="deck-toast" class="deck-toast" role="status"></p>
    </section>

    <!-- 対局 -->
    <section id="game-screen" class="screen" hidden>
      <div class="game-layout">
        <div class="player" id="panel-w"></div>
        <div class="center">
          <div class="status-bar">
            <p id="game-status" class="status"></p>
          </div>
          <div class="board-wrap">
            <div id="board" class="board"></div>
            <div id="banner" class="banner" hidden></div>
          </div>
        </div>
        <div class="player" id="panel-b"></div>
      </div>
    </section>
  </main>

  <!-- ダイアログは、外側（暗いところ）を押すと閉じる -->
  <dialog id="result-dialog" class="dialog" aria-labelledby="result-text" aria-describedby="result-sub">
    <div class="dialog-body">
      <p id="result-text" class="result-text"></p>
      <p id="result-sub" class="result-sub"></p>
      <div class="result-actions">
        <button type="button" id="again-btn" class="btn-primary">もう一局</button>
        <div class="result-secondary-actions">
          <button type="button" id="share-result" class="btn-text">画像共有</button>
          <button type="button" id="look-btn" class="btn-text">盤面を見る</button>
          <button type="button" id="deck-again" class="btn-text">デッキを変える</button>
        </div>
      </div>
    </div>
  </dialog>

  <dialog id="share-dialog" class="dialog" aria-labelledby="share-heading">
    <div class="dialog-body">
      <h2 id="share-heading">盤面を画像で共有</h2>
      <img class="share-image" id="share-image" alt="対局の盤面" hidden>
      <p id="share-status" class="share-status" role="status"></p>
      <div class="dialog-actions">
        <button type="button" id="share-native" class="btn-primary btn-small" hidden>共有先を選ぶ</button>
        <a id="share-download" class="btn-primary btn-small share-download" download="gomoku.png" hidden>PNGを保存</a>
        <form method="dialog"><button class="btn-text">閉じる</button></form>
      </div>
    </div>
  </dialog>

  <dialog id="log-dialog" class="dialog">
    <div class="dialog-body">
      <h2>ログ</h2>
      <ol id="log" class="log"></ol>
    </div>
  </dialog>

  <dialog id="rules-dialog" class="dialog">
    <div class="dialog-body">
      <h2>ルール</h2>
      <ol class="rules">
        <li>11×11の盤で、縦・横・ななめに5つ並べたら勝ち。</li>
        <li id="rules-types"></li>
        <li>ただの石は1ポイント。強い碁石ほどポイントが高い。強い碁石ばかりだと、置ける数が減る。同じ超能力は3つまで。</li>
        <li>碁石は袋に入れて混ぜ、手札が3つになるまで引く。黒から順に、手札を1つ選んで置く。</li>
        <li>碁石を使い切った人は、置かずに番を飛ばす。2人とも使い切って、まだ揃っていなければ引き分け。</li>
      </ol>
      <h3>超能力</h3>
      <dl id="ability-list" class="ability-list"></dl>
    </div>
  </dialog>

  <script src="net.js"></script>
  <script src="sound.js"></script>
  <script src="share.js"></script>
  <script src="script.js"></script>
  <script src="fx.js"></script>
  <script src="ai.js"></script>
</body>
</html>
